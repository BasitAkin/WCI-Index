name: Validate reproducibility package

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install figure dependencies
        run: python -m pip install -r requirements.txt

      - name: Reproduce numerical results and validations
        run: python analysis/run_wci_pdlr_analysis.py

      - name: Rebuild and validate figures
        run: python analysis/build_figures.py
