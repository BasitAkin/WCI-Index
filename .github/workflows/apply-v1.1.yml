name: Apply WCI-PDLR v1.1.0 update

on:
  push:
    paths:
      - '.github/workflows/apply-v1.1.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply source updates
        run: |
          set -euo pipefail
          git apply --check .update_v1_1/run.patch
          git apply .update_v1_1/run.patch
          git apply --check .update_v1_1/fig.patch
          git apply .update_v1_1/fig.patch
          cat .update_v1_1/prov_part1.csv .update_v1_1/prov_part2.csv .update_v1_1/prov_part3.csv > data/wci_input_provenance.csv
          cp .update_v1_1/README.final.md README.md
          cp .update_v1_1/CITATION.final.cff CITATION.cff
          cp .update_v1_1/DATA_DICTIONARY.final.md docs/DATA_DICTIONARY.md
          cp .update_v1_1/EVIDENCE_AND_BOUNDARIES.final.md docs/EVIDENCE_AND_BOUNDARIES.md
      - name: Regenerate analysis and figures
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python analysis/run_wci_pdlr_analysis.py
          python analysis/build_figures.py
      - name: Verify ten-case outputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from pathlib import Path
          rows = list(csv.DictReader(Path('results/wci_pdlr_comparative_results.csv').open()))
          assert len(rows) == 10
          assert all(r['WCI'].strip() and r['PDLR'].strip() and r['K_MGD'].strip() for r in rows)
          tests = list(csv.DictReader(Path('results/wci_validation_tests.csv').open()))
          assert len(tests) == 15
          assert all(r['test_status'] == 'PASS' for r in tests)
          assert Path('figures/Figure_3ab_WCI.jpg').exists()
          assert Path('figures/Figure_4ab_Decomposition.jpg').exists()
          print('PASS: ten numerical anchors, 15 validation checks, and regenerated figures verified.')
          PY
      - name: Commit synchronized package
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .update_v1_1
          git rm .github/workflows/apply-v1.1.yml
          git add README.md CITATION.cff analysis data docs results figures
          git commit -m 'Update WCI/PDLR reproducibility package to ten-case analysis'
          git push origin HEAD:main
